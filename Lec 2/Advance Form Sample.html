<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Form Sample</title>
</head>

<body>
    <main>
        <section>
            <form action="/submit" method="POST" novalidate>
                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required minlength="2" maxlength="50"
                        placeholder="Juan Dela Cruz" autocomplete="name">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required multiple placeholder="juan@example.com"
                        autocomplete="email">

                    <label for="birthdate">Birth Date:</label>
                    <input type="date" id="birthdate" name="birthdate" min="1950-01-01" max="2026-12-31">

                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" min="18" max="120" step="1">
                </fieldset>

                <fieldset>
                    <legend>Preferences</legend>

                    <label for="color">Favorite Color:</label>
                    <input type="color" id="color" name="color" value="#3498db">

                    <label for="rating">Rating (1-10):</label>
                    <input type="range" id="rating" name="rating" min="1" max="10" step="1" value="5">

                    <label for="website">Website:</label>
                    <input type="url" id="website" name="website" placeholder="https://example.com">
                </fieldset>

                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </form>
        </section>
    </main>

</body>

</html>
