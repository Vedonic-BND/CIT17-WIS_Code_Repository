<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Functionality using Fetch API</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
        }

        header {
            background: #7c3aed;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .search-container {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }

        .search-container label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #search {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        #search:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fit,
                    minmax(250px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .user-card h3 {
            margin-top: 0;
            color: #7c3aed;
        }

        .user-card p {
            color: #555;
            margin: 7px 0;
        }

        .message {
            background: white;
            padding: 18px;
            border-radius: 10px;
            color: #666;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>

    <header>
        <h1>Search Users</h1>
        <p>Search users using the Fetch API</p>
    </header>

    <main>

        <div class="search-container">

            <label for="search">
                Search
            </label>

            <input type="text" id="search" placeholder="Search by name, email, or city...">

        </div>

        <div id="results">
            <p class="message">
                Type at least 3 characters to search.
            </p>
        </div>

    </main>

    <script>

        const searchInput =
            document.querySelector('#search');

        const resultsDiv =
            document.querySelector('#results');


        searchInput.addEventListener(
            'input',
            async (e) => {

                const query =
                    e.target.value.trim().toLowerCase();


                if (query.length < 3) {

                    resultsDiv.innerHTML = `
            <p class="message">
              Type at least 3 characters to search.
            </p>
          `;

                    return;
                }


                try {

                    /*
                      JSONPlaceholder does not have a real
                      search endpoint, so we fetch the users
                      and filter them in JavaScript.
                    */

                    const response = await fetch(
                        'https://jsonplaceholder.typicode.com/users'
                    );

                    if (!response.ok) {
                        throw new Error('Search failed');
                    }

                    const users = await response.json();


                    const results = users.filter(user =>

                        user.name
                            .toLowerCase()
                            .includes(query)

                        ||

                        user.email
                            .toLowerCase()
                            .includes(query)

                        ||

                        user.address.city
                            .toLowerCase()
                            .includes(query)

                    );


                    displayResults(results);


                } catch (error) {

                    console.error(error);

                    resultsDiv.innerHTML = `
            <p class="message error">
              Search failed.
              Please try again.
            </p>
          `;
                }

            }
        );


        function displayResults(results) {

            resultsDiv.innerHTML = '';


            if (results.length === 0) {

                resultsDiv.innerHTML = `
          <p class="message">
            No users found.
          </p>
        `;

                return;
            }


            results.forEach(user => {

                const card =
                    document.createElement('div');

                card.className = 'user-card';

                card.innerHTML = `
          <h3>${user.name}</h3>

          <p>
            <strong>Email:</strong>
            ${user.email}
          </p>

          <p>
            <strong>Phone:</strong>
            ${user.phone}
          </p>

          <p>
            <strong>City:</strong>
            ${user.address.city}
          </p>
        `;

                resultsDiv.appendChild(card);

            });

        }

    </script>

</body>

</html>
