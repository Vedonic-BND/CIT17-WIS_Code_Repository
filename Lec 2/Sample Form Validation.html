<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validation Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        .form-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
        }

        .form-header p {
            margin: 0;
            font-size: 14px;
            line-height: 1.6;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 44px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            color: #0f172a;
            background: #ffffff;
            transition: 0.2s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:hover {
            border-color: #94a3b8;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        input:invalid:not(:placeholder-shown) {
            border-color: #ef4444;
        }

        button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .form-footer {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 30px 24px;
                border-radius: 16px;
            }

            .form-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">

        <div class="form-header">
            <h1>Stay Connected</h1>
            <p>Enter your email address below to continue.</p>
        </div>

        <form id="myForm">

            <div class="form-group">
                <label for="email">Email address</label>

                <div class="input-wrapper">
                    <span class="input-icon">✉</span>

                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
            </div>

            <button type="submit">
                Submit
            </button>

        </form>

        <div class="form-footer">
            Your information is safe with us.
        </div>

    </div>

    <script>
        const form = document.querySelector('#myForm');
        const emailInput = document.querySelector('#email');

        // Real-time validation
        emailInput.addEventListener('input', () => {
            const email = emailInput.value.trim();
            if (email.length > 0 && !email.includes('@')) {
                emailInput.setCustomValidity('Please enter a valid email');
            } else {
                emailInput.setCustomValidity('');
            }
        });

        // Validate on blur
        emailInput.addEventListener('blur', () => {
            if (!emailInput.value.trim()) {
                emailInput.reportValidity();
            }
        });

        // Handle submit
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            if (form.checkValidity()) {
                // All valid - submit via AJAX/Fetch
                submitForm(new FormData(form));
            } else {
                // Show all errors
                form.reportValidity();
            }
        });

        // ADDED: Shows an alert when the form passes validation and is submitted.
        function submitForm(formData) {
            alert('Form submitted successfully!');
        }
    </script>

</body>

</html>
