<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>
        /* =====================================================
       GENERAL STYLES
       ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(135deg,
                    #667eea,
                    #764ba2);

            padding: 20px;
        }


        /* =====================================================
       FORM CONTAINER
       ===================================================== */

        .form-container {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.20);
        }


        /* =====================================================
       HEADER
       ===================================================== */

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            margin: 0 0 8px;

            color: #222;

            font-size: 28px;
        }

        .form-header p {
            margin: 0;

            color: #777;

            font-size: 14px;
        }


        /* =====================================================
       FORM GROUP
       ===================================================== */

        .form-group {
            margin-bottom: 20px;
        }


        /* =====================================================
       LABEL
       ===================================================== */

        label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-size: 14px;
            font-weight: 600;
        }


        /* =====================================================
       INPUT
       ===================================================== */

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d5d5d5;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        input:focus {
            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.15);
        }


        input::placeholder {
            color: #aaa;
        }


        /* =====================================================
       ERROR INPUT
       ===================================================== */

        input.input-error {
            border-color: #dc3545;

            background-color: #fff8f8;
        }


        input.input-error:focus {
            border-color: #dc3545;

            box-shadow:
                0 0 0 3px rgba(220, 53, 69, 0.10);
        }


        /* =====================================================
       ERROR MESSAGE
       ===================================================== */

        .error-message {
            display: block;

            min-height: 18px;

            margin-top: 6px;

            color: #dc3545;

            font-size: 13px;
        }


        /* =====================================================
       BUTTON
       ===================================================== */

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(135deg,
                    #667eea,
                    #764ba2);

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }


        button:hover:not(:disabled) {
            transform: translateY(-2px);

            box-shadow:
                0 6px 15px rgba(102, 126, 234, 0.35);
        }


        button:active:not(:disabled) {
            transform: translateY(0);
        }


        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =====================================================
       RESPONSIVE DESIGN
       ===================================================== */

        @media (max-width: 480px) {

            .form-container {
                padding: 25px 20px;
            }

            .form-header h1 {
                font-size: 24px;
            }

        }
    </style>
</head>


<body>


    <div class="form-container">

        <div class="form-header">

            <h1>Create Account</h1>

            <p>
                Register your account below
            </p>

        </div>


        <form id="registrationForm" novalidate>


            <!-- =================================================
           FULL NAME
           ================================================= -->

            <div class="form-group">

                <label for="fullname">
                    Full Name
                </label>

                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required
                    minlength="2" maxlength="50" autocomplete="name">

                <span id="fullnameError" class="error-message" role="alert">
                </span>

            </div>


            <!-- =================================================
           EMAIL
           ================================================= -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input type="email" id="email" name="email" placeholder="example@email.com" required
                    autocomplete="email">

                <span id="emailError" class="error-message" role="alert">
                </span>

            </div>


            <!-- =================================================
           PASSWORD
           ================================================= -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password" id="password" name="password" placeholder="At least 8 characters" required
                    minlength="8" autocomplete="new-password">

                <span id="passwordError" class="error-message" role="alert">
                </span>

            </div>


            <!-- =================================================
           SUBMIT
           ================================================= -->

            <button type="submit" id="submitBtn">

                Register

            </button>


        </form>

    </div>


    <script>

        // =====================================================
        // GET ELEMENTS
        // =====================================================

        const form = document.querySelector('#registrationForm');

        const submitBtn =
            document.querySelector('#submitBtn');

        const fullname =
            document.querySelector('#fullname');

        const email =
            document.querySelector('#email');

        const password =
            document.querySelector('#password');

        const fullnameError =
            document.querySelector('#fullnameError');

        const emailError =
            document.querySelector('#emailError');

        const passwordError =
            document.querySelector('#passwordError');


        // =====================================================
        // VALIDATION FUNCTION
        // =====================================================

        function validateAllFields() {

            let isValid = true;


            // ---------------------------------------------------
            // CLEAR PREVIOUS ERRORS
            // ---------------------------------------------------

            fullnameError.textContent = '';
            emailError.textContent = '';
            passwordError.textContent = '';

            fullname.classList.remove('input-error');
            email.classList.remove('input-error');
            password.classList.remove('input-error');


            // ===================================================
            // FULL NAME VALIDATION
            // ===================================================

            const fullnameValue =
                fullname.value.trim();


            if (fullnameValue === '') {

                fullnameError.textContent =
                    'Full name is required.';

                fullname.classList.add('input-error');

                isValid = false;

            }

            else if (fullnameValue.length < 2) {

                fullnameError.textContent =
                    'Full name must be at least 2 characters.';

                fullname.classList.add('input-error');

                isValid = false;

            }

            else if (fullnameValue.length > 50) {

                fullnameError.textContent =
                    'Full name must not exceed 50 characters.';

                fullname.classList.add('input-error');

                isValid = false;

            }

            else if (!/^[A-Za-z ]+$/.test(fullnameValue)) {

                fullnameError.textContent =
                    'Full name must contain letters and spaces only.';

                fullname.classList.add('input-error');

                isValid = false;

            }


            // ===================================================
            // EMAIL VALIDATION
            // ===================================================

            const emailValue =
                email.value.trim();


            if (emailValue === '') {

                emailError.textContent =
                    'Email address is required.';

                email.classList.add('input-error');

                isValid = false;

            }

            else if (!email.validity.valid) {

                emailError.textContent =
                    'Please enter a valid email address.';

                email.classList.add('input-error');

                isValid = false;

            }


            // ===================================================
            // PASSWORD VALIDATION
            // ===================================================

            const passwordValue =
                password.value;


            if (passwordValue === '') {

                passwordError.textContent =
                    'Password is required.';

                password.classList.add('input-error');

                isValid = false;

            }

            else if (passwordValue.length < 8) {

                passwordError.textContent =
                    'Password must be at least 8 characters.';

                password.classList.add('input-error');

                isValid = false;

            }


            return isValid;

        }


        // =====================================================
        // FORM SUBMISSION
        // =====================================================

        form.addEventListener('submit', async (e) => {

            e.preventDefault();


            // ---------------------------------------------------
            // VALIDATE FORM
            // ---------------------------------------------------

            const isValid =
                validateAllFields();


            if (!isValid) {

                alert(
                    'Please correct the errors above.'
                );

                return;

            }


            // ---------------------------------------------------
            // DISABLE BUTTON
            // ---------------------------------------------------

            submitBtn.disabled = true;

            submitBtn.textContent =
                'Submitting...';


            try {


                // =================================================
                // PREPARE FORM DATA
                // =================================================

                const formData =
                    new FormData(form);

                const data =
                    Object.fromEntries(formData);


                console.log(
                    'Form data:',
                    data
                );


                // =================================================
                // NEXT STEP FOR STUDENTS
                // =================================================
                //
                // The frontend validation is complete.
                //
                // The next step is to connect this form
                // to a backend API.
                //
                // Replace the temporary response below with:
                //
                // const response = await fetch('/api/register', {
                //   method: 'POST',
                //   headers: {
                //     'Content-Type': 'application/json'
                //   },
                //   body: JSON.stringify(data)
                // });
                //
                // =================================================


                // -------------------------------------------------
                // TEMPORARY API RESPONSE
                // -------------------------------------------------

                const response = {
                    ok: true
                };


                // =================================================
                // HANDLE RESPONSE
                // =================================================

                if (response.ok) {

                    alert(
                        'Registration successful!'
                    );

                    form.reset();

                }

                else {

                    alert(
                        'Registration failed.'
                    );

                }


            }

            catch (error) {

                console.error(error);

                alert(
                    'Registration failed. Please try again.'
                );

            }

            finally {

                submitBtn.disabled = false;

                submitBtn.textContent =
                    'Register';

            }

        });

    </script>

</body>

</html>
