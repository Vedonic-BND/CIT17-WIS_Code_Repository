<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Form Validation</title>
</head>

<body>

    <form id="registrationForm" novalidate>

        <div class="form-group">
            <label for="fullname">Full Name:</label>

            <input type="text" id="fullname" name="fullname" required minlength="2" maxlength="50">

            <span id="fullnameError" class="error-message" role="alert">
            </span>
        </div>


        <div class="form-group">
            <label for="email">Email:</label>

            <input type="email" id="email" name="email" required>

            <span id="emailError" class="error-message" role="alert">
            </span>
        </div>


        <div class="form-group">
            <label for="password">Password:</label>

            <input type="password" id="password" name="password" required minlength="8">

            <span id="passwordError" class="error-message" role="alert">
            </span>
        </div>


        <button type="submit" id="submitBtn">
            Register
        </button>

    </form>


    <script>

        const form = document.querySelector('#registrationForm');
        const submitBtn = document.querySelector('#submitBtn');


        // =====================================================
        // FORM VALIDATION
        // =====================================================

        function validateAllFields() {

            let isValid = true;


            // Full Name
            const fullname = document.querySelector('#fullname');
            const fullnameError = document.querySelector('#fullnameError');

            if (fullname.value.trim() === '') {

                fullnameError.textContent = 'Full name is required.';
                isValid = false;

            } else if (fullname.value.trim().length < 2) {

                fullnameError.textContent =
                    'Full name must be at least 2 characters.';
                isValid = false;

            } else {

                fullnameError.textContent = '';

            }


            // Email
            const email = document.querySelector('#email');
            const emailError = document.querySelector('#emailError');

            if (email.value.trim() === '') {

                emailError.textContent = 'Email is required.';
                isValid = false;

            } else if (!email.validity.valid) {

                emailError.textContent =
                    'Please enter a valid email address.';
                isValid = false;

            } else {

                emailError.textContent = '';

            }


            // Password
            const password = document.querySelector('#password');
            const passwordError = document.querySelector('#passwordError');

            if (password.value === '') {

                passwordError.textContent = 'Password is required.';
                isValid = false;

            } else if (password.value.length < 8) {

                passwordError.textContent =
                    'Password must be at least 8 characters.';
                isValid = false;

            } else {

                passwordError.textContent = '';

            }


            return isValid;
        }


        // =====================================================
        // TOAST MESSAGE
        // =====================================================

        function showToast(message, type) {

            alert(message);

        }


        // =====================================================
        // FORM SUBMISSION
        // =====================================================

        form.addEventListener('submit', async (e) => {

            e.preventDefault();


            const isValid = validateAllFields();


            if (!isValid) {

                showToast(
                    'Please correct the errors above.',
                    'error'
                );

                return;
            }


            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';


            try {

                const formData = new FormData(form);
                const data = Object.fromEntries(formData);


                // =================================================
                // NEXT STEP FOR STUDENTS
                // =================================================
                //
                // The frontend is ready to communicate with
                // a backend API.
                //

                // with the actual fetch() request:

                // const response = await fetch('/api/register', {
                //   method: 'POST',
                //   headers: {
                //     'Content-Type': 'application/json'
                //   },
                //   body: JSON.stringify(data)
                // });
                //
                // =================================================


                // TEMPORARY:
                // Simulate a successful API response.

                const response = {
                    ok: true
                };


                if (response.ok) {

                    alert('Registration successful!');

                    form.reset();

                } else {

                    alert('Registration failed.');

                }


            } catch (error) {

                alert(
                    'Registration failed. Please try again.'
                );

            } finally {

                submitBtn.disabled = false;
                submitBtn.textContent = 'Register';

            }

        });

    </script>

</body>

</html>
