<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Semantic Page</title>
</head>

<body>
    <header>
        <h1>Website Title</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <header>
                <h2>Article Title</h2>
                <p>By <author>Jane Doe</author> | <time datetime="2026-09-27">Sept 27, 2026</time></p>
            </header>

            <section>
                <h3>Introduction</h3>
                <p>Content here...</p>
            </section>

            <section>
                <h3>Main Content</h3>
                <p>More content...</p>
            </section>

            <footer>
                <p>Comments? Contact us at...</p>
            </footer>
        </article>

        <aside>
            <h3>Related Articles</h3>
            <ul>
                <li><a href="#">Link 1</a></li>
                <li><a href="#">Link 2</a></li>
            </ul>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Company Name. All rights reserved.</p>
    </footer>
</body>

</html>
