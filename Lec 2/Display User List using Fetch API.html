<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Display User List Using Fetch API List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
        }

        header {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            opacity: 0.9;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        #userList {
            display: grid;
            grid-template-columns: repeat(auto-fit,
                    minmax(250px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);
            transition: 0.2s;
        }

        .user-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .user-card h3 {
            color: #4f46e5;
            margin-top: 0;
        }

        .user-card p {
            color: #555;
            margin: 8px 0;
        }

        .loading,
        .error {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>

    <header>
        <h1>User List</h1>
        <p>Loading users using the Fetch API</p>
    </header>

    <main>

        <div id="userList">
            <p class="loading">Loading users...</p>
        </div>

    </main>

    <script>

        async function displayUsers() {

            try {

                const response = await fetch(
                    'https://jsonplaceholder.typicode.com/users'
                );

                if (!response.ok) {
                    throw new Error('Failed to fetch users');
                }

                const users = await response.json();

                const container =
                    document.querySelector('#userList');

                container.innerHTML = '';

                users.forEach(user => {

                    const card =
                        document.createElement('div');

                    card.className = 'user-card';

                    card.innerHTML = `
            <h3>${user.name}</h3>

            <p>
              <strong>Email:</strong>
              ${user.email}
            </p>

            <p>
              <strong>Phone:</strong>
              ${user.phone}
            </p>

            <p>
              <strong>City:</strong>
              ${user.address.city}
            </p>
          `;

                    container.appendChild(card);

                });

            } catch (error) {

                console.error(
                    'Failed to load users:',
                    error
                );

                document.querySelector('#userList').innerHTML = `
          <p class="error">
            Failed to load users. Please try again.
          </p>
        `;
            }
        }

        displayUsers();

    </script>

</body>

</html>
