<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
        }

        header {
            background: #059669;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            opacity: 0.9;
        }

        main {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #059669;
            box-shadow:
                0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #047857;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            padding: 15px 20px;
            color: white;
            border-radius: 8px;
            font-weight: bold;

            opacity: 0;
            visibility: hidden;

            transform: translateY(20px);

            transition: 0.3s;
        }

        #toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        #toast.success {
            background: #16a34a;
        }

        #toast.error {
            background: #dc2626;
        }

        @media (max-width: 600px) {

            .form-container {
                padding: 20px;
            }

            #toast {
                left: 20px;
                right: 20px;
                bottom: 20px;
            }

        }
    </style>
</head>

<body>

    <header>
        <h1>Contact Us</h1>
        <p>Form Submission with Fetch API</p>
    </header>

    <main>

        <div class="form-container">

            <form id="contactForm">

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input type="text" id="name" name="name" placeholder="Enter your name" required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea id="message" name="message" placeholder="Write your message..." required></textarea>

                </div>


                <button type="submit" id="submitBtn">
                    Submit
                </button>

            </form>

        </div>

    </main>


    <div id="toast"></div>


    <script>

        const form =
            document.querySelector('#contactForm');


        form.addEventListener(
            'submit',
            async (e) => {

                e.preventDefault();


                const submitBtn =
                    document.querySelector('#submitBtn');


                submitBtn.disabled = true;

                submitBtn.textContent =
                    'Submitting...';


                try {

                    const formData =
                        new FormData(form);


                    const data =
                        Object.fromEntries(formData);


                    /*
                      JSONPlaceholder is being used here
                      as a demo API.
          
                      Replace this URL with your own
                      backend endpoint when you have one.
                    */

                    const response = await fetch(
                        'https://jsonplaceholder.typicode.com/posts',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify(data)
                        }
                    );


                    if (response.ok) {

                        showToast(
                            'Message sent successfully!',
                            'success'
                        );

                        form.reset();

                    } else {

                        throw new Error(
                            'Failed to send message'
                        );

                    }


                } catch (error) {

                    console.error(error);

                    showToast(
                        'Failed to send message. Please try again.',
                        'error'
                    );


                } finally {

                    submitBtn.disabled = false;

                    submitBtn.textContent = 'Submit';

                }

            }
        );


        function showToast(message, type) {

            const toast =
                document.querySelector('#toast');


            toast.textContent = message;

            toast.className = '';

            toast.classList.add(type);

            toast.classList.add('show');


            setTimeout(() => {

                toast.classList.remove('show');

            }, 3000);

        }

    </script>

</body>

</html>
